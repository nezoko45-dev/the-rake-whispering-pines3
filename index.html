<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>The Rake - Rebuilt</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#070908;color:#fff;font-family:Arial,sans-serif}
canvas{display:block}
#hud{position:fixed;z-index:5;left:18px;top:16px;text-shadow:0 2px 5px #000;pointer-events:none}
#title{font-size:25px;font-weight:900;letter-spacing:5px}
.stat{margin-top:5px;font-size:14px}.help{margin-top:12px;font-size:12px;opacity:.78}
#cross{position:fixed;z-index:6;left:50%;top:50%;transform:translate(-50%,-50%);font-size:22px}
#start{position:fixed;z-index:20;inset:0;display:flex;align-items:center;justify-content:center;background:#050606}
#startBox{text-align:center;padding:32px;max-width:540px}
#start h1{font-size:44px;letter-spacing:8px;margin:0 0 8px}
#start button{padding:14px 30px;border:0;border-radius:7px;font-weight:800;cursor:pointer}
#msg{margin-top:12px;font-size:13px;opacity:.8}
#flash{position:fixed;z-index:4;inset:0;background:#900;opacity:0;pointer-events:none}
</style>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
</head>
<body>
<div id="start"><div id="startBox"><h1>THE RAKE</h1><p>Rebuilt Three.js AI game</p><button id="startBtn">START GAME</button><div id="msg">Preparing...</div></div></div>
<div id="hud"><div id="title">THE RAKE</div><div class="stat" id="status">Ready</div><div class="stat" id="hp">HP: 100</div><div class="stat" id="state">Rake: stalking</div><div class="help">WASD move · Mouse look · Shift charge · Left click stunstick</div></div>
<div id="cross">+</div><div id="flash"></div>
<script>
(function(){
'use strict';
const $=id=>document.getElementById(id);
const status=$('status'),msg=$('msg'),start=$('start'),btn=$('startBtn');
if(!window.THREE||!THREE.GLTFLoader){msg.textContent='Three.js failed to load.';return;}

const scene=new THREE.Scene();
scene.background=new THREE.Color(0x070908);
scene.fog=new THREE.Fog(0x070908,45,190);
const camera=new THREE.PerspectiveCamera(72,innerWidth/innerHeight,.05,500);
camera.rotation.order='YXZ';

const renderer=new THREE.WebGLRenderer({antialias:false,powerPreference:'high-performance'});
renderer.setSize(innerWidth,innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));
renderer.outputEncoding=THREE.sRGBEncoding;
document.body.insertBefore(renderer.domElement,start);

scene.add(new THREE.HemisphereLight(0xb9c7d8,0x15110c,1.5));
const sun=new THREE.DirectionalLight(0xd7deff,1.4);
sun.position.set(30,70,20);scene.add(sun);

const ground=new THREE.Mesh(
 new THREE.PlaneGeometry(300,300),
 new THREE.MeshLambertMaterial({color:0x172019})
);
ground.rotation.x=-Math.PI/2;
scene.add(ground);

const grid=new THREE.GridHelper(300,60,0x304030,0x1c281d);
grid.position.y=.01;scene.add(grid);

for(let i=0;i<34;i++){
 const tree=new THREE.Group();
 const trunk=new THREE.Mesh(new THREE.CylinderGeometry(.22,.38,6,7),new THREE.MeshLambertMaterial({color:0x2a1c13}));
 const crown=new THREE.Mesh(new THREE.ConeGeometry(2.5,6,8),new THREE.MeshLambertMaterial({color:0x122016}));
 trunk.position.y=3;crown.position.y=7;tree.add(trunk,crown);
 tree.position.set((Math.random()-.5)*230,0,(Math.random()-.5)*230);
 scene.add(tree);
}

const player={x:0,y:1.7,z:22,yaw:0,pitch:0,hp:100,charge:false};
const ai={x:0,y:0,z:0,yaw:0,state:'stalking',stunUntil:0,nextAttack:0};

let rakeRoot=null,rakeVisual=null,mixer=null,actions={},activeAction=null;
let rakeHeight=6;

function chooseAnimations(clips){
 const out={};
 for(const clip of clips||[]){
  const n=clip.name.toLowerCase().replace(/[ _-]+/g,'');
  if(n.includes('attack'))out.attack=clip;
  else if(n.includes('parry')||n.includes('block'))out.parry=clip;
  else if(n.includes('run')||n.includes('chase'))out.chase=clip;
  else if(n.includes('walk'))out.walk=clip;
  else if(n.includes('idle'))out.idle=clip;
 }
 return out;
}
function play(name){
 const a=actions[name];
 if(!a||activeAction===a)return;
 if(activeAction)activeAction.fadeOut(.12);
 a.reset().fadeIn(.12).play();
 activeAction=a;
}

// Clean A* on a flat ground grid. Trees are treated as blocked cells.
const CELL=3, RANGE=48;
const obstacles=[];
function buildObstacleMap(){
 obstacles.length=0;
 scene.traverse(o=>{
  if(o.userData&&o.userData.rakeObstacle)obstacles.push(o);
 });
}
function blocked(gx,gz){
 const wx=gx*CELL,wz=gz*CELL;
 for(const o of obstacles){
  const dx=wx-o.position.x,dz=wz-o.position.z;
  if(dx*dx+dz*dz<10)return true;
 }
 return false;
}
function astar(sx,sz,gx,gz){
 const sxg=Math.round(sx/CELL),szg=Math.round(sz/CELL);
 const gxg=Math.round(gx/CELL),gzg=Math.round(gz/CELL);
 const minX=sxg-Math.ceil(RANGE/CELL),maxX=sxg+Math.ceil(RANGE/CELL);
 const minZ=szg-Math.ceil(RANGE/CELL),maxZ=szg+Math.ceil(RANGE/CELL);
 const key=(x,z)=>x+','+z;
 const h=(x,z)=>Math.abs(x-gxg)+Math.abs(z-gzg);
 const open=[{x:sxg,z:szg,g:0,f:h(sxg,szg)}],came=new Map(),score=new Map([[key(sxg,szg),0]]);
 const closed=new Set();
 while(open.length){
  open.sort((a,b)=>a.f-b.f);
  const cur=open.shift(),ck=key(cur.x,cur.z);
  if(closed.has(ck))continue;
  closed.add(ck);
  if(cur.x===gxg&&cur.z===gzg){
   const path=[];let k=ck;
   while(k){const [x,z]=k.split(',').map(Number);path.push({x:x*CELL,z:z*CELL});k=came.get(k);}
   return path.reverse();
  }
  for(let ox=-1;ox<=1;ox++)for(let oz=-1;oz<=1;oz++){
   if(!ox&&!oz)continue;
   const nx=cur.x+ox,nz=cur.z+oz;
   if(nx<minX||nx>maxX||nz<minZ||nz>maxZ)continue;
   if(blocked(nx,nz))continue;
   const nk=key(nx,nz),ng=cur.g+((ox&&oz)?1.414:1);
   if(ng<(score.get(nk)??Infinity)){
    score.set(nk,ng);came.set(nk,ck);
    open.push({x:nx,z:nz,g:ng,f:ng+h(nx,nz)});
   }
  }
 }
 return [{x:gx,z:gz}];
}
let path=[],pathIndex=0,nextPath=0;
function updatePath(now){
 if(now<nextPath)return;
 path=astar(ai.x,ai.z,player.x,player.z);
 pathIndex=Math.min(1,Math.max(0,path.length-1));
 nextPath=now+220;
}
function moveAI(dt){
 if(!path.length)return;
 const p=path[pathIndex]||{x:player.x,z:player.z};
 let dx=p.x-ai.x,dz=p.z-ai.z,d=Math.hypot(dx,dz);
 if(d<1.25){
  if(pathIndex<path.length-1)pathIndex++;
  return;
 }
 const dist=Math.hypot(player.x-ai.x,player.z-ai.z);
 const speed=dist<=45?19:7;
 ai.x+=dx/d*speed*dt;
 ai.z+=dz/d*speed*dt;
 ai.y=0;
 ai.yaw=Math.atan2(dx,dz);
}

function addTreesAsObstacles(){
 scene.traverse(o=>{
  if(o.isGroup && o.children.length===2 && o.position.y===0){
   o.userData.rakeObstacle=true;
  }
 });
 buildObstacleMap();
}

function normalizeRake(gltf){
 // The visual stays inside a dedicated world root.
 rakeRoot=new THREE.Group();
 rakeRoot.name='RakeAI_Root';
 rakeRoot.position.set(ai.x,0,ai.z);
 scene.add(rakeRoot);

 rakeVisual=gltf.scene;
 rakeVisual.name='RakeVisual';
 rakeVisual.rotation.set(0,0,0);
 rakeVisual.position.set(0,0,0);
 rakeVisual.scale.set(1,1,1);
 rakeVisual.traverse(o=>{
  o.visible=true;
  o.frustumCulled=false;
  if(o.isMesh){
   o.castShadow=false;o.receiveShadow=false;
   if(o.material)o.material.side=THREE.DoubleSide;
  }
 });
 rakeRoot.add(rakeVisual);

 // Update world matrices before measuring, as required for correct Box3 bounds.
 rakeRoot.updateWorldMatrix(true,true);
 let box=new THREE.Box3().setFromObject(rakeVisual,true);
 let size=box.getSize(new THREE.Vector3());
 rakeHeight=Math.max(size.y,.001);
 const targetHeight=6;
 const s=targetHeight/rakeHeight;
 rakeVisual.scale.setScalar(s);
 rakeRoot.updateWorldMatrix(true,true);

 // Center the rendered mesh over the AI root and put its feet at y=0.
 box.setFromObject(rakeVisual,true);
 const center=box.getCenter(new THREE.Vector3());
 const minY=box.min.y;
 rakeVisual.position.x-=center.x;
 rakeVisual.position.z-=center.z;
 rakeVisual.position.y-=minY;
 rakeRoot.updateWorldMatrix(true,true);

 // Face -Z by default. If the source asset is authored backwards, the root can turn it.
 rakeVisual.rotation.y=0;

 mixer=new THREE.AnimationMixer(rakeVisual);
 const map=chooseAnimations(gltf.animations);
 for(const k in map){
  actions[k]=mixer.clipAction(map[k]);
  actions[k].setLoop(THREE.LoopRepeat,Infinity);
 }
 if(actions.idle)play('idle');
 else if(actions.walk)play('walk');
 else{
  const first=Object.keys(actions)[0];
  if(first)play(first);
 }
 status.textContent='Rake AI ready';
 msg.textContent='Rake loaded';
 console.log('Rake normalized', {height:rakeHeight,animations:gltf.animations.map(a=>a.name)});
}

function loadRake(){
 status.textContent='Loading Rake...';
 const loader=new THREE.GLTFLoader();
 const urls=[
  './assets/rake/rake.glb',
  'https://raw.githubusercontent.com/nezoko45-dev/the-rake-whispering-pines3/main/assets/rake/rake.glb',
  'https://cdn.jsdelivr.net/gh/nezoko45-dev/the-rake-whispering-pines3@main/assets/rake/rake.glb'
 ];
 let i=0;
 function next(){
  if(i>=urls.length){
   status.textContent='Rake failed to load';
   msg.textContent='Could not load the Rake model.';
   return;
  }
  const url=urls[i++];
  loader.load(url,g=>normalizeRake(g),p=>{
   if(p.total)status.textContent='Loading Rake '+Math.round(p.loaded/p.total*100)+'%';
  },()=>next());
 }
 next();
}

const keys={};
addEventListener('keydown',e=>{keys[e.code]=true;if(['KeyW','KeyA','KeyS','KeyD','Space'].includes(e.code))e.preventDefault();});
addEventListener('keyup',e=>keys[e.code]=false);

renderer.domElement.addEventListener('click',()=>{
 if(start.style.display==='none')renderer.domElement.requestPointerLock();
});
addEventListener('mousemove',e=>{
 if(document.pointerLockElement!==renderer.domElement)return;
 player.yaw-=e.movementX*.0022;
 player.pitch=Math.max(-1.35,Math.min(1.35,player.pitch-e.movementY*.0022));
});

addEventListener('mousedown',e=>{
 if(e.button!==0)return;
 const dx=ai.x-player.x,dz=ai.z-player.z,d=Math.hypot(dx,dz);
 if(d>9)return;
 const face=(Math.sin(player.yaw)*dx-Math.cos(player.yaw)*dz)/(d||1);
 if(player.charge&&face>.82){
  ai.state='parry';ai.stunUntil=performance.now()+350;
  player.hp=Math.max(0,player.hp-10);
 }else{
  ai.state='stunned';ai.stunUntil=performance.now()+2500;
 }
});

btn.onclick=()=>{
 start.style.display='none';
 player.yaw=0;player.pitch=0;
 // Spawn the Rake 12 units in front of the player, guaranteed inside the camera view.
 ai.x=0;ai.y=0;ai.z=8;ai.yaw=0;
 loadRake();
 renderer.domElement.requestPointerLock();
};

let last=performance.now();
function loop(now){
 requestAnimationFrame(loop);
 const dt=Math.min((now-last)/1000,.05);last=now;

 let mx=0,mz=0;
 if(keys.KeyW)mz+=1;
 if(keys.KeyS)mz-=1;
 if(keys.KeyA)mx-=1;
 if(keys.KeyD)mx+=1;
 const len=Math.hypot(mx,mz);
 if(len){
  mx/=len;mz/=len;
  const forwardX=Math.sin(player.yaw),forwardZ=-Math.cos(player.yaw);
  const rightX=Math.cos(player.yaw),rightZ=Math.sin(player.yaw);
  const worldX=forwardX*mz+rightX*mx;
  const worldZ=forwardZ*mz+rightZ*mx;
  const speed=keys.ShiftLeft||keys.ShiftRight?10:6;
  player.x+=worldX*speed*dt;
  player.z+=worldZ*speed*dt;
 }
 player.charge=!!(keys.ShiftLeft||keys.ShiftRight);

 if(now>=ai.stunUntil){
  const dx=player.x-ai.x,dz=player.z-ai.z,dist=Math.hypot(dx,dz)||1;
  if(dist<=8){
   ai.state='attack';
   if(now>=ai.nextAttack){
    ai.nextAttack=now+650;
    player.hp=Math.max(0,player.hp-20);
    $('flash').style.opacity=.4;
    setTimeout(()=>$('flash').style.opacity=0,100);
   }
  }else{
   ai.state=dist<=45?'chase':'stalking';
   updatePath(now);
   moveAI(dt);
  }
 }else if(ai.state!=='parry')ai.state='stunned';

 if(rakeRoot){
  rakeRoot.position.set(ai.x,0,ai.z);
  rakeRoot.rotation.y=ai.yaw;
 }
 if(mixer)mixer.update(dt);

 const wanted=ai.state==='attack'?'attack':
  ai.state==='parry'?'parry':
  ai.state==='chase'?(actions.chase?'chase':actions.walk?'walk':'idle'):
  (actions.walk?'walk':'idle');
 if(actions[wanted])play(wanted);

 camera.position.set(player.x,player.y,player.z);
 camera.rotation.y=player.yaw;
 camera.rotation.x=player.pitch;

 $('hp').textContent='HP: '+player.hp;
 $('state').textContent='Rake: '+ai.state;
 renderer.render(scene,camera);
}
requestAnimationFrame(loop);

addEventListener('resize',()=>{
 camera.aspect=innerWidth/innerHeight;
 camera.updateProjectionMatrix();
 renderer.setSize(innerWidth,innerHeight);
});
})();
</script>
</body>
</html>

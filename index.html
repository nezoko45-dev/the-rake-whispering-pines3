<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>The Rake — Whispering Pines</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#050706;color:#fff;font-family:Arial,Helvetica,sans-serif}
canvas{display:block;width:100%;height:100%}
#hud{position:fixed;z-index:5;left:18px;top:16px;pointer-events:none;text-shadow:0 2px 8px #000}
.title{font-size:25px;font-weight:900;letter-spacing:5px}.line{margin-top:5px}.dim{opacity:.72}
#cross{position:fixed;z-index:6;left:50%;top:50%;transform:translate(-50%,-50%);font-size:20px;opacity:.8}
#vignette{position:fixed;z-index:3;inset:0;pointer-events:none;background:radial-gradient(circle,transparent 35%,rgba(0,0,0,.5) 100%)}
#start,#death{position:fixed;z-index:20;inset:0;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle at center,#142018 0,#030504 72%)}
#death{display:none}
.box{text-align:center;width:min(520px,90vw)}.box h1{font-size:48px;letter-spacing:10px;margin:0 0 8px}.box p{opacity:.7}
button{border:0;border-radius:5px;padding:14px 32px;background:#e9ece8;color:#080a08;font-weight:900;cursor:pointer;letter-spacing:1px}
button:hover{background:#fff}#msg{margin-top:14px;min-height:18px;opacity:.75}
#loading{position:fixed;z-index:25;inset:0;display:none;align-items:center;justify-content:center;background:#030504}
.loadbox{width:min(420px,80vw);text-align:center}.bar{height:5px;background:#222;margin-top:16px;border-radius:9px;overflow:hidden}.bar i{display:block;height:100%;width:0;background:#ddd;transition:width .2s}
#damage{position:fixed;inset:0;z-index:4;pointer-events:none;background:rgba(180,0,0,.35);opacity:0;transition:opacity .12s}
</style>
<script src="https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.180.0/examples/js/loaders/GLTFLoader.js"></script>
</head>
<body>
<div id="start"><div class="box"><h1>THE RAKE</h1><p>WHISPERING PINES</p><button id="startBtn">ENTER THE FOREST</button><div id="msg">Start TheRakeServer.exe first.</div></div></div>
<div id="loading"><div class="loadbox"><b>LOADING THE RAKE</b><div class="bar"><i id="loadbar"></i></div><div id="loadtext" class="dim">Preparing forest…</div></div></div>
<div id="death"><div class="box"><h1>YOU DIED</h1><p>The forest went quiet.</p><button id="respawn">RESPAWN</button></div></div>
<div id="hud">
  <div class="title">THE RAKE</div>
  <div class="line" id="status">Offline</div>
  <div class="line" id="hp">HP: 100</div>
  <div class="line" id="clock">Time: --:--</div>
  <div class="line" id="rstate">Rake: --</div>
  <div class="line" id="pc">Players: 0</div>
  <div class="line dim">WASD · Mouse · Shift sprint · Left click parry</div>
</div>
<div id="cross">+</div><div id="vignette"></div><div id="damage"></div>

<script>
(function(){
'use strict';
if(!window.THREE||!THREE.GLTFLoader){document.getElementById('msg').textContent='Three.js failed to load.';return}

const $=id=>document.getElementById(id);
const scene=new THREE.Scene();
scene.background=new THREE.Color(0x050706);
scene.fog=new THREE.FogExp2(0x08100b,.012);

const camera=new THREE.PerspectiveCamera(72,innerWidth/innerHeight,.05,500);
camera.rotation.order='YXZ';

const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(devicePixelRatio,1.75));
renderer.setSize(innerWidth,innerHeight);
if('outputColorSpace' in renderer) renderer.outputColorSpace=THREE.SRGBColorSpace; else renderer.outputEncoding=THREE.sRGBEncoding;
renderer.shadowMap.enabled=true;
renderer.shadowMap.type=THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);

const hemi=new THREE.HemisphereLight(0x9eb0bd,0x15100b,.8);scene.add(hemi);
const moon=new THREE.DirectionalLight(0xaec5e8,1.15);
moon.position.set(-45,80,30);moon.castShadow=true;
moon.shadow.mapSize.set(1024,1024);
moon.shadow.camera.left=-90;moon.shadow.camera.right=90;moon.shadow.camera.top=90;moon.shadow.camera.bottom=-90;
scene.add(moon);

const world=new THREE.Group();scene.add(world);
const ground=new THREE.Mesh(
  new THREE.PlaneGeometry(300,300,1,1),
  new THREE.MeshStandardMaterial({color:0x182219,roughness:1,metalness:0})
);
ground.rotation.x=-Math.PI/2;ground.receiveShadow=true;world.add(ground);

const pathMat=new THREE.MeshStandardMaterial({color:0x24241d,roughness:1});
const pathMesh=new THREE.Mesh(new THREE.CircleGeometry(18,32),pathMat);
pathMesh.rotation.x=-Math.PI/2;pathMesh.scale.set(1.8,1,.5);pathMesh.position.set(0,.008,22);world.add(pathMesh);

const player={id:null,x:0,z:22,yaw:0,pitch:0,hp:100,alive:true};
const rake={x:0,z:12,yaw:0,state:'stalking'};
const keys=Object.create(null);
const remotes=new Map();
let socket=null,trees=[],rakeRoot=null,rakeVisual=null,mixer=null,actions={},activeAction=null;
let last=performance.now(),lastSend=0,lastHp=100,connected=false;

function makeForest(){
  const trunkMat=new THREE.MeshStandardMaterial({color:0x241a12,roughness:1});
  const leafMat=new THREE.MeshStandardMaterial({color:0x102015,roughness:1});
  for(const t of trees){
    const g=new THREE.Group();
    const trunk=new THREE.Mesh(new THREE.CylinderGeometry(.18,.34,5.5,7),trunkMat);
    trunk.position.y=2.75;trunk.castShadow=true;trunk.receiveShadow=true;
    const crown=new THREE.Mesh(new THREE.ConeGeometry(2.4,6,8),leafMat);
    crown.position.y=7; crown.castShadow=true;
    g.add(trunk,crown);g.position.set(t.x,0,t.z);world.add(g);
  }
}

function animationMap(clips){
  const out={};
  for(const clip of clips||[]){
    const n=(clip.name||'').toLowerCase().replace(/[ _-]/g,'');
    if(n.includes('attack'))out.attack=clip;
    else if(n.includes('parry')||n.includes('block'))out.parry=clip;
    else if(n.includes('run')||n.includes('chase')||n.includes('sprint'))out.chase=clip;
    else if(n.includes('walk'))out.walk=clip;
    else if(n.includes('idle'))out.idle=clip;
  }
  return out;
}

function playAnimation(name){
  const next=actions[name]||actions.idle||actions.walk;
  if(!next||next===activeAction)return;
  if(activeAction)activeAction.fadeOut(.14);
  next.reset().fadeIn(.14).play();
  activeAction=next;
}

function normalizeRake(root){
  root.updateMatrixWorld(true);
  let box=new THREE.Box3().setFromObject(root);
  const size=box.getSize(new THREE.Vector3());
  if(size.y>0)root.scale.multiplyScalar(6/size.y);
  root.updateMatrixWorld(true);
  box=new THREE.Box3().setFromObject(root);
  const center=box.getCenter(new THREE.Vector3());
  root.position.x-=center.x;
  root.position.z-=center.z;
  root.position.y-=box.min.y;
  root.updateMatrixWorld(true);
}

async function loadRake(){
  const loader=new THREE.GLTFLoader();
  const url='/assets/rake/rake.glb?cache='+Date.now();
  $('loadtext').textContent='Checking Rake model…';
  try{
    const controller=new AbortController();
    const timer=setTimeout(()=>controller.abort(),15000);
    const response=await fetch(url,{cache:'no-store',signal:controller.signal});
    clearTimeout(timer);
    if(!response.ok)throw new Error('HTTP '+response.status+' '+response.statusText+' for '+url);
    const total=Number(response.headers.get('content-length'))||0;
    const buffer=await response.arrayBuffer();
    $('loadbar').style.width='75%';
    $('loadtext').textContent='Parsing Rake model…';
    loader.parse(buffer,'/assets/rake/',g=>{
    const anchor=new THREE.Group();
    const visual=g.scene;
    visual.visible=true;
    visual.traverse(o=>{
      o.visible=true;
      if(o.isMesh){
        o.castShadow=true;o.receiveShadow=true;o.frustumCulled=false;
        const mats=Array.isArray(o.material)?o.material:[o.material];
        for(const mat of mats){
          if(!mat)continue;
          mat.transparent=false;
          mat.opacity=1;
          mat.depthWrite=true;
          mat.depthTest=true;
          mat.needsUpdate=true;
        }
      }
    });
    // Keep the imported GLB intact; only normalize its visual container.
    anchor.add(visual);
    normalizeRake(visual);
    anchor.rotation.y=Math.PI;
    anchor.position.set(rake.x,.08,rake.z);
    rakeRoot=anchor;rakeVisual=visual;scene.add(anchor);
    console.log('Rake GLB loaded:',g.animations.map(a=>a.name), 'meshes:',visual.getObjectsByProperty('isMesh',true).length);
    mixer=new THREE.AnimationMixer(visual);
    const mapped=animationMap(g.animations);
    actions={};
    for(const name in mapped){
      const a=mixer.clipAction(mapped[name]);
      if(name==='attack'||name==='parry')a.setLoop(THREE.LoopOnce,1),a.clampWhenFinished=true;
      actions[name]=a;
    }
    playAnimation(actions.idle?'idle':actions.walk?'walk':actions.chase?'chase':'idle');
    $('loadbar').style.width='100%';
    $('loadtext').textContent='Rake ready.';
    setTimeout(()=>{$('loading').style.display='none'},250);
  },err=>{
    console.error('Rake GLB parse failed:',err);
    $('loadtext').textContent='Rake model parse failed: '+(err&&err.message?err.message:'unknown error');
    $('status').textContent='Rake model failed';
  });
  }catch(err){
    console.error('Rake GLB fetch failed:',err);
    $('loadtext').textContent=err&&err.name==='AbortError'?'Rake model timed out after 15 seconds':('Rake model failed: '+(err&&err.message?err.message:'unknown error'));
    $('status').textContent='Rake model failed';
  }
}

function createRemote(p){
  const group=new THREE.Group();
  const body=new THREE.Mesh(new THREE.CapsuleGeometry(.42,1.15,4,8),new THREE.MeshStandardMaterial({color:0x607b9e,roughness:.9}));
  body.position.y=1;body.castShadow=true;group.add(body);
  scene.add(group);
  return {mesh:group,target:new THREE.Vector3(p.x,0,p.z),yaw:p.yaw||0};
}

function connect(){
  const protocol=location.protocol==='https:'?'wss':'ws';
  const host=location.host||'localhost:8080';
  socket=new WebSocket(protocol+'://'+host+'/ws');
  socket.onopen=()=>{connected=true;$('status').textContent='Multiplayer connected'};
  socket.onclose=()=>{connected=false;$('status').textContent='Server disconnected'};
  socket.onerror=()=>{$('status').textContent='Server connection error'};
  socket.onmessage=e=>{
    let m;try{m=JSON.parse(e.data)}catch{return}
    if(m.type==='welcome'){
      player.id=m.id;trees=m.trees||[];makeForest();loadRake();
      $('status').textContent='Multiplayer · Rake loading';
    }
    if(m.type==='snapshot'){
      rake.x=m.rake.x;rake.z=m.rake.z;rake.yaw=m.rake.yaw;rake.state=m.rake.state;
      $('clock').textContent='Time: '+formatTime(m.clockTime);
      $('rstate').textContent='Rake: '+m.rake.state;
      $('pc').textContent='Players: '+m.players.length;
      const seen=new Set();
      for(const p of m.players){
        seen.add(p.id);
        if(p.id===player.id){
          player.hp=p.hp;
          if(p.hp<lastHp)$('damage').style.opacity='.7';
          lastHp=p.hp;
          continue;
        }
        let q=remotes.get(p.id);
        if(!q){q=createRemote(p);remotes.set(p.id,q)}
        q.target.set(p.x,0,p.z);q.yaw=p.yaw||0;
      }
      for(const [id,q] of remotes)if(!seen.has(id)){scene.remove(q.mesh);remotes.delete(id)}
      if(player.hp<=0)die();
    }
  };
}

function formatTime(t){
  return String(Math.floor(t)%24).padStart(2,'0')+':'+String(Math.floor((t%1)*60)).padStart(2,'0');
}

function send(parry=false,respawn=false){
  if(socket&&socket.readyState===WebSocket.OPEN)
    socket.send(JSON.stringify({type:'input',x:player.x,z:player.z,yaw:player.yaw,parry,respawn}));
}

function die(){
  if(!player.alive)return;
  player.alive=false;
  $('death').style.display='flex';
  if(document.pointerLockElement===renderer.domElement)document.exitPointerLock();
}

function respawn(){
  player.x=0;player.z=22;player.hp=100;player.alive=true;lastHp=100;
  $('death').style.display='none';send(false,true);renderer.domElement.requestPointerLock();
}

function movePlayer(dt){
  let ix=0,iz=0;
  if(keys.KeyW)iz+=1;if(keys.KeyS)iz-=1;if(keys.KeyA)ix-=1;if(keys.KeyD)ix+=1;
  const len=Math.hypot(ix,iz);if(!len)return;
  ix/=len;iz/=len;
  const sin=Math.sin(player.yaw),cos=Math.cos(player.yaw);
  const wx=sin*iz+cos*ix,wz=-cos*iz+sin*ix;
  const speed=(keys.ShiftLeft||keys.ShiftRight)?10:6;
  player.x+=wx*speed*dt;player.z+=wz*speed*dt;
  player.x=Math.max(-108,Math.min(108,player.x));player.z=Math.max(-108,Math.min(108,player.z));
}

function updateRake(dt){
  if(!rakeRoot)return;
  rakeRoot.position.set(rake.x,.02,rake.z);
  rakeRoot.rotation.y=rake.yaw;
  if(mixer){
    mixer.update(dt);
    const desired=rake.state==='attack'?'attack':
      rake.state==='parry'?'parry':
      rake.state==='chase'&&actions.chase?'chase':
      actions.walk?'walk':'idle';
    playAnimation(desired);
  }
  // Keep the animated/skinned feet on the forest floor even when the GLB has root motion.
  if(rakeVisual){
    // Correct root-motion/animation offsets without allowing the model to disappear below terrain.
    rakeRoot.updateMatrixWorld(true);
    const box=new THREE.Box3().setFromObject(rakeVisual);
    if(Number.isFinite(box.min.y)){
      const correction=Math.max(-.02,Math.min(.12,-box.min.y));
      rakeRoot.position.y+=correction;
    }
  }
}

function render(now){
  requestAnimationFrame(render);
  const dt=Math.min((now-last)/1000,.05);last=now;
  if(player.alive){
    movePlayer(dt);
    camera.position.set(player.x,1.72,player.z);
    camera.rotation.y=player.yaw;camera.rotation.x=player.pitch;
    if(now-lastSend>50){send();lastSend=now}
  }
  for(const q of remotes.values()){
    q.mesh.position.lerp(q.target,Math.min(1,dt*12));
    q.mesh.rotation.y=q.yaw;
  }
  updateRake(dt);
  $('hp').textContent='HP: '+Math.max(0,Math.round(player.hp));
  if($('damage').style.opacity!=='0')$('damage').style.opacity=String(Math.max(0,parseFloat($('damage').style.opacity)-dt*3));
  renderer.render(scene,camera);
}

function resize(){
  camera.aspect=innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);
}
addEventListener('resize',resize);
addEventListener('keydown',e=>{keys[e.code]=true});
addEventListener('keyup',e=>{keys[e.code]=false});
addEventListener('mousemove',e=>{
  if(document.pointerLockElement!==renderer.domElement||!player.alive)return;
  player.yaw-=e.movementX*.0022;
  player.pitch=Math.max(-1.35,Math.min(1.35,player.pitch-e.movementY*.0022));
});
addEventListener('mousedown',e=>{
  if(e.button===0&&player.alive&&Math.hypot(rake.x-player.x,rake.z-player.z)<=9)send(true);
});
$('startBtn').onclick=()=>{
  $('start').style.display='none';$('loading').style.display='flex';$('msg').textContent='Connecting…';
  connect();renderer.domElement.requestPointerLock();
};
$('respawn').onclick=respawn;
renderer.domElement.addEventListener('click',()=>{if(player.alive&&document.pointerLockElement!==renderer.domElement)renderer.domElement.requestPointerLock()});

$('msg').textContent='Start TheRakeServer.exe, then enter the forest.';
requestAnimationFrame(render);
})();
</script>
</body>
</html>

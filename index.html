<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>The Rake — Whispering Pines 2D</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#07100c;color:#e9f1ec;font-family:Inter,system-ui,Arial,sans-serif}.game{position:relative;width:100vw;height:100vh}.hud,.help,.legend{position:absolute;z-index:5;padding:10px 13px;border:1px solid #34483d;border-radius:10px;background:#07100ddd;backdrop-filter:blur(8px)}.hud{left:16px;top:14px;min-width:255px}.line{display:flex;justify-content:space-between;gap:22px;margin:4px 0;color:#9eaea5;font-size:12px}.line strong{color:#e8eee9}.health{margin-top:8px}.healthbar{height:10px;border:1px solid #46594f;border-radius:999px;overflow:hidden;background:#101813}.healthfill{height:100%;width:100%;background:#63c978;transition:width .15s}.help{right:16px;top:14px;color:#aebbb3;font-size:11px}.legend{left:16px;bottom:14px;color:#aebbb3;font-size:11px}.banner{position:absolute;z-index:6;left:50%;top:15px;transform:translateX(-50%);padding:8px 16px;border-radius:999px;background:#321014dd;border:1px solid #8f323b;color:#ffd9dc;font-size:12px;font-weight:800;opacity:0;transition:.2s}.banner.show{opacity:1}canvas{display:block;width:100%;height:100%}</style></head><body><div class="game"><canvas id="game"></canvas><div class="hud"><b id="phase">NIGHT</b><div class="line"><span>Time</span><strong id="clock">7:30 PM</strong></div><div class="line"><span>Rake state</span><strong id="state">Searching</strong></div><div class="line"><span>Distance</span><strong id="distance">—</strong></div><div class="line"><span>Speed</span><strong id="speed">7</strong></div><div class="health"><div class="line"><span>Player Health</span><strong id="healthText">100 / 100</strong></div><div class="healthbar"><div class="healthfill" id="healthFill"></div></div></div></div><div class="help">WASD / Arrow Keys — move • Survive the night</div><div class="legend">Dark circles are bushes • 45 studs = active range</div><div class="banner" id="banner"></div></div><script>
const c=document.getElementById('game'),x=c.getContext('2d'),$=id=>document.getElementById(id);let W,H,dpr;function resize(){dpr=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;c.width=W*dpr;c.height=H*dpr;x.setTransform(dpr,0,0,dpr,0,0)}addEventListener('resize',resize);resize();
const rakeFrames={idle:new Image(),walkLeft:new Image(),walkRight:new Image(),attack1:new Image(),attack2:new Image()};rakeFrames.idle.src='download.jpg';rakeFrames.walkLeft.src='the rake walking left.jpg';rakeFrames.walkRight.src='the rake walking right (1).jpg';rakeFrames.attack1.src='the rake attack (1).jpg';rakeFrames.attack2.src='the rake attack2.jpg';
const WW=2200,WH=1400,DAY=150,NIGHT=450,keys={};addEventListener('keydown',e=>{keys[e.key.toLowerCase()]=1});addEventListener('keyup',e=>{keys[e.key.toLowerCase()]=0});const player={x:1100,y:760,r:12,speed:6,maxHealth:100,health:100,damageCooldown:0,dead:false},spawn={x:1100,y:760};const rake={x:260,y:500,r:22,mode:'searching',hideUntil:0,lungUntil:0,searchPoint:null,searchUntil:0,angle:0,anim:0,facing:1,animName:'idle',attackFrame:0,attackTimer:0,attackCooldown:0,attackDamageCooldown:0};const bushes=[],rocks=[];const rand=(a,b)=>a+Math.random()*(b-a),dist=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y);for(let i=0;i<100;i++){let b={x:rand(40,WW-40),y:rand(40,WH-40),r:rand(18,31)};if(dist(b,spawn)>100)bushes.push(b)}for(let i=0;i<90;i++)rocks.push({x:rand(20,WW-20),y:rand(20,WH-20),r:rand(3,9)});let night=true,elapsed=0,clock=19*60,prev=performance.now();function banner(t){let e=$('banner');e.textContent=t;e.classList.add('show');clearTimeout(banner.t);banner.t=setTimeout(()=>e.classList.remove('show'),2200)}function bushNear(o){let b=null,bd=1e9;for(const q of bushes){let d=dist(o,q);if(d<bd&&d<q.r+30){b=q;bd=d}}return b}function point(){rake.searchPoint={x:rand(60,WW-60),y:rand(60,WH-60)};rake.searchUntil=performance.now()/1000+rand(5,12)}function mode(m){rake.mode=m;$('state').textContent=m[0].toUpperCase()+m.slice(1)}function move(o,t,s,dt){let dx=t.x-o.x,dy=t.y-o.y,d=Math.hypot(dx,dy)||1;o.x+=dx/d*s*dt;o.y+=dy/d*s*dt;o.x=Math.max(20,Math.min(WW-20,o.x));o.y=Math.max(20,Math.min(WH-20,o.y));if(o===rake){rake.angle=Math.atan2(dy,dx);if(Math.abs(dx)>0.05)rake.facing=dx<0?-1:1}}function hurtPlayer(amount){if(player.dead||player.damageCooldown>0)return;player.health=Math.max(0,player.health-amount);player.damageCooldown=.7;if(player.health<=0){player.dead=true;banner('THE RAKE GOT YOU');setTimeout(()=>{player.health=player.maxHealth;player.dead=false;player.x=spawn.x;player.y=spawn.y;banner('YOU RESPAWNED')},1800)}}function startSlash(now){if(rake.attackCooldown>0||player.dead)return;rake.attackFrame=Math.random()<.5?1:2;rake.attackTimer=0;rake.attackCooldown=.9;rake.attackDamageCooldown=.16;rake.animName='attack'}function updateAttack(dt){if(rake.attackCooldown>0)rake.attackCooldown=Math.max(0,rake.attackCooldown-dt);if(rake.attackDamageCooldown>0)rake.attackDamageCooldown=Math.max(0,rake.attackDamageCooldown-dt);if(rake.animName==='attack'){rake.attackTimer+=dt;if(rake.attackTimer>=.42){rake.animName='idle';rake.attackTimer=0}if(rake.attackDamageCooldown===0&&dist(rake,player)<30){hurtPlayer(20);rake.attackDamageCooldown=-1}}}function ai(dt,now){if(!night){mode('retreating');rake.animName='walk';move(rake,spawn,11,dt);return}let d=dist(rake,player);if(rake.mode==='hiding'){rake.animName='idle';if(now>=rake.hideUntil){mode('searching');point()}return}if(rake.mode==='lunging'){rake.animName='walk';move(rake,player,25,dt);if(d<30)startSlash(now);if(now>=rake.lungUntil){rake.mode='searching';let b=bushNear(rake);if(b){rake.x=b.x;rake.y=b.y;rake.hideUntil=now+20;mode('hiding')}else point()}return}if(d<=45){let b=bushNear(rake);if(b){rake.x=b.x;rake.y=b.y;rake.hideUntil=now+20;mode('hiding');banner('THE RAKE HIDES UNDER A BUSH')}else{mode('stalking');rake.animName='walk';move(rake,player,19,dt);if(d<30)startSlash(now);if(d<18){rake.lungUntil=now+3;mode('lunging');banner('THE RAKE LUNGES!')}}return}if(!rake.searchPoint||now>=rake.searchUntil)point();mode('searching');rake.animName='walk';move(rake,rake.searchPoint,7,dt);if(dist(rake,rake.searchPoint)<10)point()}function update(dt){elapsed+=dt;clock+=dt/60;player.damageCooldown=Math.max(0,player.damageCooldown-dt);if(elapsed>=(night?NIGHT:DAY)){elapsed=0;night=!night;if(night){rake.x=spawn.x;rake.y=spawn.y;point();banner('NIGHT FALLS — THE RAKE IS HUNTING')}else{rake.mode='retreating';rake.hideUntil=0;banner('DAYLIGHT — THE RAKE RETREATS')}}if(!player.dead){let dx=(keys.d||keys.arrowright?1:0)-(keys.a||keys.arrowleft?1:0),dy=(keys.s||keys.arrowdown?1:0)-(keys.w||keys.arrowup?1:0),l=Math.hypot(dx,dy)||1;player.x=Math.max(20,Math.min(WW-20,player.x+dx/l*player.speed*dt*10));player.y=Math.max(20,Math.min(WH-20,player.y+dy/l*player.speed*dt*10))}ai(dt,performance.now()/1000);updateAttack(dt);rake.anim+=dt;let d=dist(rake,player);$('phase').textContent=night?'NIGHT':'DAY';$('distance').textContent=d.toFixed(1)+' studs';$('speed').textContent=night?(rake.mode==='lunging'?'25':d<=45?'19':'7'):'11';$('healthText').textContent=`${player.health} / ${player.maxHealth}`;$('healthFill').style.width=(player.health/player.maxHealth*100)+'%';let h=Math.floor(clock/60)%24,m=Math.floor(clock)%60;$('clock').textContent=`${h%12||12}:${String(m).padStart(2,'0')} ${h>=12?'PM':'AM'}`}function currentRakeImage(){if(rake.animName==='attack')return rake.attackFrame===1?rakeFrames.attack1:rakeFrames.attack2;if(rake.animName==='walk')return rake.facing<0?rakeFrames.walkLeft:rakeFrames.walkRight;return rakeFrames.idle}function drawRake(){if(rake.mode==='hiding'&&Math.floor(performance.now()/250)%2===0)return;let im=currentRakeImage(),loaded=im.complete&&im.naturalWidth>0,bob=rake.animName==='walk'?Math.sin(rake.anim*10)*2:0;x.save();x.translate(rake.x,rake.y+bob);let w=rake.animName==='attack'?82:74,h=82;if(loaded){x.globalAlpha=rake.mode==='hiding'?.62:1;x.drawImage(im,-w/2,-h/2,w,h)}else{x.fillStyle='#171b19';x.beginPath();x.arc(0,0,rake.r,0,7);x.fill()}x.restore()}function draw(){x.clearRect(0,0,W,H);let cx=Math.max(0,Math.min(WW-W,player.x-W/2)),cy=Math.max(0,Math.min(WH-H,player.y-H/2));x.save();x.translate(-cx,-cy);x.fillStyle=night?'#101a14':'#536b51';x.fillRect(0,0,WW,WH);x.globalAlpha=.25;x.strokeStyle=night?'#294032':'#71836a';for(let i=0;i<WW;i+=80){x.beginPath();x.moveTo(i,0);x.lineTo(i,WH);x.stroke()}for(let i=0;i<WH;i+=80){x.beginPath();x.moveTo(0,i);x.lineTo(WW,i);x.stroke()}x.globalAlpha=1;for(const r of rocks){x.fillStyle=night?'#27342c':'#727968';x.beginPath();x.arc(r.x,r.y,r.r,0,7);x.fill()}for(const b of bushes){x.fillStyle=night?'#17271d':'#344c31';x.beginPath();x.arc(b.x,b.y,b.r,0,7);x.fill();x.fillStyle=night?'#29402f':'#4b6944';x.beginPath();x.arc(b.x-6,b.y-5,b.r*.7,0,7);x.fill()}x.strokeStyle='#8fa694';x.setLineDash([5,5]);x.beginPath();x.arc(spawn.x,spawn.y,28,0,7);x.stroke();x.setLineDash([]);if(night){x.strokeStyle='#bd424b';x.globalAlpha=.18;x.beginPath();x.arc(rake.x,rake.y,45,0,7);x.stroke();x.globalAlpha=1}x.fillStyle=player.dead?'#8b3a40':'#dce9e0';x.beginPath();x.arc(player.x,player.y,player.r,0,7);x.fill();drawRake();x.restore();if(night){let g=x.createRadialGradient(W/2,H/2,80,W/2,H/2,Math.max(W,H)*.72);g.addColorStop(0,'transparent');g.addColorStop(1,'rgba(0,0,0,.58)');x.fillStyle=g;x.fillRect(0,0,W,H)}}function loop(t){let dt=Math.min(.1,(t-prev)/1000);prev=t;update(dt);draw();requestAnimationFrame(loop)}point();requestAnimationFrame(loop);
</script></body></html>

<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>The Rake — Whispering Pines 2D</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#07100c;color:#e9f1ec;font-family:Inter,system-ui,Arial,sans-serif}body{display:grid;place-items:center}.game{position:relative;width:100vw;height:100vh}.hud{position:absolute;z-index:5;left:16px;top:14px;padding:12px 15px;border:1px solid #34483d;border-radius:12px;background:#07100ddd;backdrop-filter:blur(8px);min-width:245px}.line{display:flex;justify-content:space-between;gap:22px;margin:4px 0;color:#9eaea5;font-size:12px}.line strong{color:#e8eee9}.help,.legend{position:absolute;z-index:5;padding:10px 13px;border:1px solid #34483d;border-radius:10px;background:#07100dcc;color:#aebbb3;font-size:11px}.help{right:16px;top:14px}.legend{left:16px;bottom:14px}.banner{position:absolute;z-index:6;left:50%;top:15px;transform:translateX(-50%);padding:8px 16px;border-radius:999px;background:#321014dd;border:1px solid #8f323b;color:#ffd9dc;font-size:12px;font-weight:800;opacity:0;transition:.2s}.banner.show{opacity:1}canvas{display:block;width:100%;height:100%}</style></head><body><div class="game"><canvas id="game"></canvas><div class="hud"><b id="phase">NIGHT</b><div class="line"><span>Time</span><strong id="clock">7:30 PM</strong></div><div class="line"><span>Rake state</span><strong id="state">Searching</strong></div><div class="line"><span>Distance</span><strong id="distance">—</strong></div><div class="line"><span>Speed</span><strong id="speed">7</strong></div></div><div class="help">WASD / Arrow Keys — move • Survive the night</div><div class="legend">Dark circles are bushes • 45 studs = active range</div><div class="banner" id="banner"></div></div><script>
const c=document.getElementById('game'),x=c.getContext('2d'),$=id=>document.getElementById(id);let W,H,dpr;function resize(){dpr=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;c.width=W*dpr;c.height=H*dpr;x.setTransform(dpr,0,0,dpr,0,0)}addEventListener('resize',resize);resize();
const WW=2200,WH=1400,DAY=150,NIGHT=450;const keys={};addEventListener('keydown',e=>{keys[e.key.toLowerCase()]=1});addEventListener('keyup',e=>{keys[e.key.toLowerCase()]=0});const player={x:1100,y:760,r:12,speed:6},spawn={x:1100,y:760},rake={x:260,y:500,r:15,mode:'searching',hideUntil:0,lungUntil:0,searchPoint:null,searchUntil:0};const bushes=[],rocks=[];const rand=(a,b)=>a+Math.random()*(b-a),dist=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y);for(let i=0;i<100;i++){let b={x:rand(40,WW-40),y:rand(40,WH-40),r:rand(18,31)};if(dist(b,spawn)>100)bushes.push(b)}for(let i=0;i<90;i++)rocks.push({x:rand(20,WW-20),y:rand(20,WH-20),r:rand(3,9)});let night=true,elapsed=0,clock=19*60,prev=performance.now();function banner(t){let e=$('banner');e.textContent=t;e.classList.add('show');clearTimeout(banner.t);banner.t=setTimeout(()=>e.classList.remove('show'),2200)}function bushNear(o){let b=null,bd=1e9;for(const q of bushes){let d=dist(o,q);if(d<bd&&d<q.r+30){b=q;bd=d}}return b}function point(){rake.searchPoint={x:rand(60,WW-60),y:rand(60,WH-60)};rake.searchUntil=performance.now()/1000+rand(5,12)}function mode(m){rake.mode=m;$('state').textContent=m[0].toUpperCase()+m.slice(1)}function move(o,t,s,dt){let dx=t.x-o.x,dy=t.y-o.y,d=Math.hypot(dx,dy)||1;o.x+=dx/d*s*dt;o.y+=dy/d*s*dt;o.x=Math.max(20,Math.min(WW-20,o.x));o.y=Math.max(20,Math.min(WH-20,o.y))}
function ai(dt,now){if(!night){mode('retreating');move(rake,spawn,11,dt);return}let d=dist(rake,player);if(rake.mode==='hiding'){if(now>=rake.hideUntil){mode('searching');point()}return}if(rake.mode==='lunging'){move(rake,player,25,dt);if(now>=rake.lungUntil){rake.mode='searching';let b=bushNear(rake);if(b){rake.x=b.x;rake.y=b.y;rake.hideUntil=now+20;mode('hiding')}else point()}return}if(d<=45){let b=bushNear(rake);if(b){rake.x=b.x;rake.y=b.y;rake.hideUntil=now+20;mode('hiding');banner('THE RAKE HIDES UNDER A BUSH')}else{mode('stalking');move(rake,player,19,dt);if(d<18){rake.lungUntil=now+3;mode('lunging');banner('THE RAKE LUNGES!')}}return}if(!rake.searchPoint||now>=rake.searchUntil)point();mode('searching');move(rake,rake.searchPoint,7,dt);if(dist(rake,rake.searchPoint)<10)point()}
function update(dt){elapsed+=dt;clock+=dt/60;if(elapsed>=(night?NIGHT:DAY)){elapsed=0;night=!night;if(night){rake.x=spawn.x;rake.y=spawn.y;point();banner('NIGHT FALLS — THE RAKE IS HUNTING')}else{rake.mode='retreating';rake.hideUntil=0;banner('DAYLIGHT — THE RAKE RETREATS')}}let dx=(keys.d||keys.arrowright?1:0)-(keys.a||keys.arrowleft?1:0),dy=(keys.s||keys.arrowdown?1:0)-(keys.w||keys.arrowup?1:0),l=Math.hypot(dx,dy)||1;player.x=Math.max(20,Math.min(WW-20,player.x+dx/l*player.speed*dt*10));player.y=Math.max(20,Math.min(WH-20,player.y+dy/l*player.speed*dt*10));ai(dt,performance.now()/1000);let d=dist(rake,player);$('phase').textContent=night?'NIGHT':'DAY';$('distance').textContent=d.toFixed(1)+' studs';$('speed').textContent=night?(d<=45?'19':rake.mode==='lunging'?'25':'7'):'11';let h=Math.floor(clock/60)%24,m=Math.floor(clock)%60;$('clock').textContent=`${h%12||12}:${String(m).padStart(2,'0')} ${h>=12?'PM':'AM'}`}
function draw(){x.clearRect(0,0,W,H);let cx=Math.max(0,Math.min(WW-W,player.x-W/2)),cy=Math.max(0,Math.min(WH-H,player.y-H/2));x.save();x.translate(-cx,-cy);x.fillStyle=night?'#101a14':'#536b51';x.fillRect(0,0,WW,WH);x.globalAlpha=.25;x.strokeStyle=night?'#294032':'#71836a';for(let i=0;i<WW;i+=80){x.beginPath();x.moveTo(i,0);x.lineTo(i,WH);x.stroke()}for(let i=0;i<WH;i+=80){x.beginPath();x.moveTo(0,i);x.lineTo(WW,i);x.stroke()}x.globalAlpha=1;for(const r of rocks){x.fillStyle=night?'#27342c':'#727968';x.beginPath();x.arc(r.x,r.y,r.r,0,7);x.fill()}for(const b of bushes){x.fillStyle=night?'#17271d':'#344c31';x.beginPath();x.arc(b.x,b.y,b.r,0,7);x.fill();x.fillStyle=night?'#29402f':'#4b6944';x.beginPath();x.arc(b.x-6,b.y-5,b.r*.7,0,7);x.fill()}x.strokeStyle='#8fa694';x.setLineDash([5,5]);x.beginPath();x.arc(spawn.x,spawn.y,28,0,7);x.stroke();x.setLineDash([]);if(night){x.strokeStyle='#bd424b';x.globalAlpha=.18;x.beginPath();x.arc(rake.x,rake.y,45,0,7);x.stroke();x.globalAlpha=1}x.fillStyle='#dce9e0';x.beginPath();x.arc(player.x,player.y,player.r,0,7);x.fill();if(rake.mode!=='hiding'||Math.floor(performance.now()/250)%2===0){x.fillStyle=rake.mode==='lunging'?'#ef5963':'#171b19';x.beginPath();x.arc(rake.x,rake.y,rake.r,0,7);x.fill();x.strokeStyle='#bd3c46';x.lineWidth=2;for(let i=0;i<3;i++){x.beginPath();x.moveTo(rake.x-8+i*8,rake.y+8);x.lineTo(rake.x-12+i*10,rake.y+19);x.stroke()}x.fillStyle='#d64a52';x.beginPath();x.arc(rake.x-5,rake.y-3,2.5,0,7);x.arc(rake.x+5,rake.y-3,2.5,0,7);x.fill()}x.restore();if(night){let g=x.createRadialGradient(W/2,H/2,80,W/2,H/2,Math.max(W,H)*.72);g.addColorStop(0,'transparent');g.addColorStop(1,'rgba(0,0,0,.58)');x.fillStyle=g;x.fillRect(0,0,W,H)}}function loop(t){let dt=Math.min(.1,(t-prev)/1000);prev=t;update(dt);draw();requestAnimationFrame(loop)}point();requestAnimationFrame(loop);
</script></body></html>

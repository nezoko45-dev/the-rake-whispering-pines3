<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>The Rake — Whispering Pines 2D</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#050706;color:#fff;font-family:Arial,Helvetica,sans-serif}body{touch-action:none}
canvas#game{display:block;width:100%;height:100%;image-rendering:auto}
#hud{position:fixed;z-index:5;left:18px;top:16px;pointer-events:none;text-shadow:0 2px 8px #000}.title{font-size:25px;font-weight:900;letter-spacing:5px}.line{margin-top:5px}.dim{opacity:.72}
#cross{position:fixed;z-index:6;left:50%;top:50%;transform:translate(-50%,-50%);font-size:20px;opacity:.8;pointer-events:none}
#vignette{position:fixed;z-index:3;inset:0;pointer-events:none;background:radial-gradient(circle,transparent 35%,rgba(0,0,0,.55) 100%)}
.screen{position:fixed;z-index:20;inset:0;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle at center,#142018 0,#030504 72%)}#death{display:none}
.box{width:min(540px,90vw);text-align:center}.box h1{font-size:48px;letter-spacing:10px;margin:0 0 8px}.box p{opacity:.7}
button{border:0;border-radius:5px;padding:14px 32px;background:#e9ece8;color:#080a08;font-weight:900;cursor:pointer;letter-spacing:1px}button:hover{background:#fff}
#msg{margin-top:14px;min-height:18px;opacity:.75}#damage{position:fixed;inset:0;z-index:4;pointer-events:none;background:rgba(180,0,0,.35);opacity:0}
#controls{position:fixed;right:18px;bottom:16px;z-index:6;display:flex;gap:8px;pointer-events:none}#controls span{padding:7px 10px;border:1px solid #ffffff22;background:#050706aa;border-radius:5px;font:12px monospace;color:#ddd}
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="hud"><div class="title">THE RAKE</div><div class="line" id="status">Offline</div><div class="line" id="hp">HP: 100</div><div class="line" id="clock">Time: --:--</div><div class="line" id="rstate">Rake: --</div><div class="line" id="pc">Players: 0</div><div class="line dim">WASD · Mouse · Shift sprint · Left click parry</div></div>
<div id="cross">+</div><div id="vignette"></div><div id="damage"></div>
<div id="controls"><span>2D SPRITE MODE</span><span id="animLabel">IDLE</span></div>
<div id="start" class="screen"><div class="box"><h1>THE RAKE</h1><p>WHISPERING PINES · 2D</p><button id="startBtn">ENTER THE FOREST</button><div id="msg">Start TheRakeServer.exe first.</div></div></div>
<div id="death" class="screen"><div class="box"><h1>YOU DIED</h1><p>The forest went quiet.</p><button id="respawn">RESPAWN</button></div></div>
<script>
const $=id=>document.getElementById(id),canvas=$('game'),ctx=canvas.getContext('2d');ctx.imageSmoothingEnabled=false;
const sheet=new Image();sheet.src='the%20rake%20spritesheet.jpg';
let sheetReady=false,COLS=4,ROWS=5,cellW=1,cellH=1,frames=[],currentFrame=0,animTimer=0,animIndex=0;const FRAME_MS=95;\nconst spriteCanvas=document.createElement('canvas'),spriteCtx=spriteCanvas.getContext('2d');
sheet.onload=()=>{sheetReady=true;ROWS=5;COLS=Math.max(1,Math.round(sheet.naturalWidth/sheet.naturalHeight*ROWS));cellW=sheet.naturalWidth/COLS;cellH=sheet.naturalHeight/ROWS;spriteCanvas.width=sheet.naturalWidth;spriteCanvas.height=sheet.naturalHeight;spriteCtx.drawImage(sheet,0,0);const img=spriteCtx.getImageData(0,0,spriteCanvas.width,spriteCanvas.height),d=img.data;for(let y=0;y<spriteCanvas.height;y++)for(let x=0;x<spriteCanvas.width;x++){const i=(y*spriteCanvas.width+x)*4,r=d[i],g=d[i+1],b=d[i+2],max=Math.max(r,g,b),min=Math.min(r,g,b);if(max<70&&max-min<28||r<45&&g<45&&b<45)d[i+3]=0;else if(max<105&&max-min<22)d[i+3]=Math.max(0,Math.floor((max-35)/70*255))}spriteCtx.putImageData(img,0,0);frames=[];for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++)frames.push({c,r});setFrame(0)};
const player={id:null,x:0,z:22,yaw:0,hp:100,alive:true},rake={x:0,z:12,yaw:0,state:'stalking'},keys=Object.create(null),remotes=new Map(),trees=[];
let socket=null,last=performance.now(),lastSend=0,lastHp=100,worldScale=18;
function resize(){const d=Math.min(devicePixelRatio||1,2);canvas.width=Math.floor(innerWidth*d);canvas.height=Math.floor(innerHeight*d);canvas.style.width=innerWidth+'px';canvas.style.height=innerHeight+'px';ctx.setTransform(d,0,0,d,0,0)}addEventListener('resize',resize);resize();
function setFrame(i){if(!sheetReady)return;currentFrame=Math.max(0,Math.min(frames.length-1,i))}
function playRows(a,b,reverse=false){const list=[];for(let r=a;r<b;r++)for(let c=0;c<COLS;c++)list.push(r*COLS+c);if(reverse)list.reverse();if(!list.length)return;if(animIndex>=list.length)animIndex=0;setFrame(list[animIndex++]);if(animIndex>=list.length)animIndex=0}
function updateAnimation(dt){animTimer+=dt*1000;if(animTimer<FRAME_MS)return;animTimer=0;
if(rake.state==='attack'){playRows(3,5);$('animLabel').textContent='ATTACK'}
else if(rake.state==='parry'){playRows(4,5);$('animLabel').textContent='PARRY'}
else if(rake.state==='chase'||rake.state==='stalking'||rake.state==='retreat'){playRows(0,3,player.z<rake.z);$('animLabel').textContent=player.z<rake.z?'WALK UP':'WALK DOWN'}
else{animIndex=0;setFrame(0);$('animLabel').textContent='IDLE'}}
function drawSprite(x,y,size,flip=false){if(!sheetReady)return;const f=frames[currentFrame],sx=f.c*cellW,sy=f.r*cellH;ctx.save();ctx.translate(x,y);if(flip)ctx.scale(-1,1);const ratio=cellW/cellH,w=size*ratio,h=size;ctx.drawImage(spriteCanvas,sx,sy,cellW,cellH,-w/2,-h/2,w,h);ctx.restore()}
function worldToScreen(x,z){return{x:innerWidth/2+(x-player.x)*worldScale,y:innerHeight/2+(z-player.z)*worldScale}}
function drawForest(){ctx.fillStyle='#071008';ctx.fillRect(0,0,innerWidth,innerHeight);const tile=worldScale*3,ox=((-player.x*worldScale)%tile+tile)%tile,oy=((-player.z*worldScale)%tile+tile)%tile;
for(let x=ox-tile;x<innerWidth+tile;x+=tile)for(let y=oy-tile;y<innerHeight+tile;y+=tile){ctx.fillStyle=((Math.round((x-ox)/tile)+Math.round((y-oy)/tile))&1)?'#0a150d':'#0c180f';ctx.fillRect(x,y,tile,tile)}
ctx.fillStyle='#24251d';const p=worldToScreen(0,22);ctx.beginPath();ctx.ellipse(p.x,p.y,worldScale*24,worldScale*5,0,0,Math.PI*2);ctx.fill();
for(const t of trees){const s=worldToScreen(t.x,t.z);if(s.x<-80||s.x>innerWidth+80||s.y<-80||s.y>innerHeight+80)continue;ctx.fillStyle='#25190f';ctx.fillRect(s.x-5,s.y-14,10,30);ctx.fillStyle='#102317';ctx.beginPath();ctx.arc(s.x,s.y-22,27,0,Math.PI*2);ctx.fill();ctx.fillStyle='#0c1c11';ctx.beginPath();ctx.arc(s.x+9,s.y-31,18,0,Math.PI*2);ctx.fill()}}
function drawPlayer(){const s=worldToScreen(player.x,player.z);ctx.fillStyle='#9eb6d1';ctx.beginPath();ctx.arc(s.x,s.y,9,0,Math.PI*2);ctx.fill();ctx.strokeStyle='#dfeaff';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(s.x,s.y);ctx.lineTo(s.x+Math.sin(player.yaw)*18,s.y+Math.cos(player.yaw)*18);ctx.stroke()}
function drawRemote(q){const s=worldToScreen(q.x,q.z);ctx.fillStyle='#6684a5';ctx.beginPath();ctx.arc(s.x,s.y,8,0,Math.PI*2);ctx.fill()}
function drawRake(){const s=worldToScreen(rake.x,rake.z),size=Math.max(70,Math.min(150,worldScale*6));drawSprite(s.x,s.y,size,player.x-rake.x<0);ctx.fillStyle='#0009';ctx.beginPath();ctx.ellipse(s.x,s.y+size*.36,size*.28,size*.08,0,0,Math.PI*2);ctx.fill()}
function draw(){drawForest();for(const q of remotes.values())drawRemote(q);drawPlayer();drawRake()}
function forestFromServer(list){trees.length=0;for(const t of list||[])trees.push(t)}
function connect(){const protocol=location.protocol==='https:'?'wss':'ws',host=location.host||'localhost:8080';socket=new WebSocket(protocol+'://'+host+'/ws');
socket.onopen=()=>{$('status').textContent='Multiplayer connected';$('msg').textContent='Connected.'};socket.onclose=()=>{$('status').textContent='Server disconnected'};socket.onerror=()=>{$('status').textContent='Server connection error'};
socket.onmessage=event=>{let m;try{m=JSON.parse(event.data)}catch{return}if(m.type==='welcome'){player.id=m.id;forestFromServer(m.trees);$('status').textContent='Multiplayer · 2D Rake ready';return}if(m.type!=='snapshot')return;
rake.x=m.rake.x;rake.z=m.rake.z;rake.yaw=m.rake.yaw;rake.state=m.rake.state;$('clock').textContent='Time: '+clock(m.clockTime);$('rstate').textContent='Rake: '+m.rake.state;$('pc').textContent='Players: '+m.players.length;
const seen=new Set;for(const p of m.players){seen.add(p.id);if(p.id===player.id){player.hp=p.hp;if(p.hp<lastHp)$('damage').style.opacity='.7';lastHp=p.hp;continue}let q=remotes.get(p.id);if(!q){q={x:p.x,z:p.z,yaw:p.yaw};remotes.set(p.id,q)}q.x+=(p.x-q.x)*.28;q.z+=(p.z-q.z)*.28;q.yaw=p.yaw||0}
for(const [id] of remotes)if(!seen.has(id))remotes.delete(id);if(player.hp<=0)die()}}
function clock(t){return String(Math.floor(t)%24).padStart(2,'0')+':'+String(Math.floor((t%1)*60)).padStart(2,'0')}
function send(parry=false,respawn=false){if(socket&&socket.readyState===WebSocket.OPEN)socket.send(JSON.stringify({type:'input',x:player.x,z:player.z,yaw:player.yaw,parry,respawn}))}
function die(){if(!player.alive)return;player.alive=false;$('death').style.display='flex'}
function respawn(){player.x=0;player.z=22;player.hp=100;player.alive=true;lastHp=100;$('death').style.display='none';send(false,true)}
function move(dt){let x=0,z=0;if(keys.KeyW)z-=1;if(keys.KeyS)z+=1;if(keys.KeyA)x-=1;if(keys.KeyD)x+=1;const len=Math.hypot(x,z);if(!len)return;x/=len;z/=len;const speed=(keys.ShiftLeft||keys.ShiftRight)?10:6;player.x=Math.max(-110,Math.min(110,player.x+x*speed*dt));player.z=Math.max(-110,Math.min(110,player.z+z*speed*dt))}
addEventListener('keydown',e=>keys[e.code]=true);addEventListener('keyup',e=>keys[e.code]=false);
addEventListener('mousedown',e=>{if(e.button===0&&player.alive&&Math.hypot(rake.x-player.x,rake.z-player.z)<=9)send(true)});
addEventListener('mousemove',e=>{if(!player.alive)return;player.yaw=Math.atan2(e.clientX-innerWidth/2,e.clientY-innerHeight/2)});
$('startBtn').onclick=()=>{$('start').style.display='none';$('msg').textContent='Connecting…';connect()};$('respawn').onclick=respawn;
function frame(now){requestAnimationFrame(frame);const dt=Math.min((now-last)/1000,.05);last=now;if(player.alive){move(dt);if(now-lastSend>50){send();lastSend=now}}updateAnimation(dt);draw();$('hp').textContent='HP: '+Math.max(0,Math.round(player.hp));const d=Number.parseFloat($('damage').style.opacity||'0');if(d>0)$('damage').style.opacity=String(Math.max(0,d-dt*3))}requestAnimationFrame(frame);
</script></body></html>

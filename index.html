<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>The Rake — Whispering Pines</title>
<style>html,body{margin:0;height:100%;overflow:hidden;background:#050706;color:#fff;font:14px Arial}canvas{display:block}#hud{position:fixed;z-index:4;top:15px;left:18px;text-shadow:0 2px 5px #000;pointer-events:none}.title{font-size:25px;font-weight:900;letter-spacing:5px}.s{margin-top:5px}#help{margin-top:12px;opacity:.8}#cross{position:fixed;z-index:5;left:50%;top:50%;transform:translate(-50%,-50%);font-size:22px}#start,#death{position:fixed;z-index:20;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(3,5,4,.97)}#death{display:none}.box{text-align:center}.box h1{font-size:42px;letter-spacing:8px}button{padding:14px 30px;font-weight:800;border:0;border-radius:7px;cursor:pointer}#msg{margin-top:12px;opacity:.8}</style>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script><script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script></head><body>
<div id="start"><div class="box"><h1>THE RAKE</h1><p>Whispering Pines</p><button id="startBtn">START GAME</button><div id="msg">Connecting...</div></div></div>
<div id="death"><div class="box"><h1>YOU DIED</h1><p>The Rake got you.</p><button id="respawn">RESPAWN</button></div></div>
<div id="hud"><div class="title">THE RAKE</div><div class="s" id="status">Offline</div><div class="s" id="hp">HP: 100</div><div class="s" id="clock">Time: --:--</div><div class="s" id="rstate">Rake: stalking</div><div class="s" id="pc">Players: 0</div><div id="help">WASD move · Mouse look · Shift sprint · Left click stunstick/parry</div></div><div id="cross">+</div>
<script>
(()=>{const $=id=>document.getElementById(id);if(!window.THREE||!THREE.GLTFLoader){$('msg').textContent='Three.js failed to load.';return}
const scene=new THREE.Scene();scene.background=new THREE.Color(0x050706);scene.fog=new THREE.Fog(0x050706,42,190);
const cam=new THREE.PerspectiveCamera(72,innerWidth/innerHeight,.05,500);cam.rotation.order='YXZ';
const ren=new THREE.WebGLRenderer({antialias:false,powerPreference:'high-performance'});ren.setSize(innerWidth,innerHeight);ren.setPixelRatio(Math.min(devicePixelRatio,1.5));ren.outputEncoding=THREE.sRGBEncoding;document.body.appendChild(ren.domElement);
scene.add(new THREE.HemisphereLight(0xb9c7d8,0x15110c,1.5));const sun=new THREE.DirectionalLight(0xd7deff,1.3);sun.position.set(30,70,20);scene.add(sun);
const ground=new THREE.Mesh(new THREE.PlaneGeometry(300,300),new THREE.MeshLambertMaterial({color:0x172019}));ground.rotation.x=-Math.PI/2;scene.add(ground);
const player={id:null,x:0,y:1.7,z:22,yaw:0,pitch:0,hp:100,alive:true},rake={x:0,z:12,yaw:0,state:'stalking'};let socket,trees=[],rakeRoot,mixer,actions={},active,remote=new Map(),last=performance.now(),lastSend=0;
function forest(){for(const t of trees){const g=new THREE.Group(),tr=new THREE.Mesh(new THREE.CylinderGeometry(.22,.38,6,7),new THREE.MeshLambertMaterial({color:0x2a1c13})),cr=new THREE.Mesh(new THREE.ConeGeometry(2.5,6,8),new THREE.MeshLambertMaterial({color:0x122016}));tr.position.y=3;cr.position.y=7;g.add(tr,cr);g.position.set(t.x,0,t.z);scene.add(g)}}
function animMap(cs){const o={};for(const c of cs||[]){const n=c.name.toLowerCase().replace(/[ _-]/g,'');if(n.includes('attack'))o.attack=c;else if(n.includes('parry')||n.includes('block'))o.parry=c;else if(n.includes('run')||n.includes('chase'))o.chase=c;else if(n.includes('walk'))o.walk=c;else if(n.includes('idle'))o.idle=c}return o}
function play(n){const a=actions[n];if(!a||a===active)return;if(active)active.fadeOut(.1);a.reset().fadeIn(.1).play();active=a}
function loadRake(){new THREE.GLTFLoader().load('./assets/rake/rake.glb',g=>{rakeRoot=new THREE.Group();const a=new THREE.Group(),v=g.scene;v.traverse(o=>{o.visible=true;o.frustumCulled=false});a.add(v);rakeRoot.add(a);scene.add(rakeRoot);rakeRoot.updateMatrixWorld(true);let b=new THREE.Box3().setFromObject(v),s=b.getSize(new THREE.Vector3());if(s.y>0)a.scale.setScalar(6/s.y);rakeRoot.updateMatrixWorld(true);b=new THREE.Box3().setFromObject(v);const c=b.getCenter(new THREE.Vector3());v.position.x-=c.x;v.position.z-=c.z;v.position.y-=b.min.y;a.rotation.y=Math.PI;mixer=new THREE.AnimationMixer(v);actions={};for(const k in animMap(g.animations))actions[k]=mixer.clipAction(animMap(g.animations)[k]);play(actions.idle?'idle':actions.walk?'walk':Object.keys(actions)[0]);$('status').textContent='Multiplayer · Rake loaded'},e=>{$('status').textContent='Rake GLB failed to load';console.error(e)})}
function connect(){const p=location.protocol==='https:'?'wss':'ws',h=location.host||'localhost:8080';socket=new WebSocket(p+'://'+h+'/ws');socket.onopen=()=>{$('status').textContent='Multiplayer connected'};socket.onclose=()=>{$('status').textContent='Server disconnected'};socket.onerror=()=>{$('status').textContent='Server connection error'};socket.onmessage=e=>{let m;try{m=JSON.parse(e.data)}catch{return}if(m.type==='welcome'){player.id=m.id;trees=m.trees||[];forest();loadRake()}if(m.type==='snapshot'){rake.x=m.rake.x;rake.z=m.rake.z;rake.yaw=m.rake.yaw;rake.state=m.rake.state;$('clock').textContent='Time: '+time(m.clockTime);$('rstate').textContent='Rake: '+m.rake.state;$('pc').textContent='Players: '+m.players.length;for(const p of m.players){if(p.id===player.id){player.hp=p.hp;continue}let q=remote.get(p.id);if(!q){q={mesh:new THREE.Mesh(new THREE.CapsuleGeometry(.45,1.1,4,8),new THREE.MeshLambertMaterial({color:0x4b6b9a})),target:new THREE.Vector3(),yaw:0};q.mesh.position.y=1;scene.add(q.mesh);remote.set(p.id,q)}q.target.set(p.x,0,p.z);q.yaw=p.yaw}if(player.hp<=0)die()}}}
function time(t){return String(Math.floor(t)%24).padStart(2,'0')+':'+String(Math.floor(t%1*60)).padStart(2,'0')}
function send(parry=false,respawn=false){if(socket?.readyState===1)socket.send(JSON.stringify({type:'input',x:player.x,z:player.z,yaw:player.yaw,parry,respawn}))}
function die(){if(!player.alive)return;player.alive=false;$('death').style.display='flex';if(document.pointerLockElement)document.exitPointerLock()}
function resp(){player.x=0;player.z=22;player.hp=100;player.alive=true;$('death').style.display='none';send(false,true);ren.domElement.requestPointerLock()}
$('startBtn').onclick=()=>{$('start').style.display='none';connect();ren.domElement.requestPointerLock()};$('respawn').onclick=resp;ren.domElement.onclick=()=>player.alive&&ren.domElement.requestPointerLock();
const keys={};addEventListener('keydown',e=>{keys[e.code]=true});addEventListener('keyup',e=>keys[e.code]=false);addEventListener('mousemove',e=>{if(document.pointerLockElement!==ren.domElement||!player.alive)return;player.yaw-=e.movementX*.0022;player.pitch=Math.max(-1.35,Math.min(1.35,player.pitch-e.movementY*.0022))});
addEventListener('mousedown',e=>{if(e.button===0&&player.alive&&Math.hypot(rake.x-player.x,rake.z-player.z)<=9)send(true)});
function loop(now){requestAnimationFrame(loop);const dt=Math.min((now-last)/1000,.05);last=now;if(player.alive){let x=0,z=0;if(keys.KeyW)z++;if(keys.KeyS)z--;if(keys.KeyA)x--;if(keys.KeyD)x++;const l=Math.hypot(x,z);if(l){x/=l;z/=l;const fx=Math.sin(player.yaw),fz=-Math.cos(player.yaw),rx=Math.cos(player.yaw),rz=Math.sin(player.yaw),wx=fx*z+rx*x,wz=fz*z+rz*x,sp=(keys.ShiftLeft||keys.ShiftRight)?10:6;player.x+=wx*sp*dt;player.z+=wz*sp*dt}cam.position.set(player.x,player.y,player.z);cam.rotation.y=player.yaw;cam.rotation.x=player.pitch;if(now-lastSend>50){send();lastSend=now}}for(const q of remote.values()){q.mesh.position.lerp(q.target,Math.min(1,dt*12));q.mesh.rotation.y=q.yaw}if(rakeRoot){rakeRoot.position.set(rake.x,0,rake.z);rakeRoot.rotation.y=rake.yaw}if(mixer){mixer.update(dt);const n=rake.state==='attack'?'attack':rake.state==='parry'?'parry':rake.state==='chase'&&actions.chase?'chase':actions.walk?'walk':'idle';play(n)}$('hp').textContent='HP: '+Math.max(0,player.hp);ren.render(scene,cam)}requestAnimationFrame(loop);addEventListener('resize',()=>{cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix();ren.setSize(innerWidth,innerHeight)});$('msg').textContent='Start the server, then press START GAME.';loop(performance.now())})();
</script></body></html>

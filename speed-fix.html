const survivorBots=[];const survivorNames=['Survivor 1','Survivor 2','Survivor 3','Survivor 4'];let survivorTarget=null,survivorHits=0,survivorLastTarget=null;
function survivorSpawn(i){const a=(i/4)*Math.PI*2+Math.random()*.4,r=45+Math.random()*55;return{x:Math.max(30,Math.min(WW-30,spawn.x+Math.cos(a)*r)),y:Math.max(30,Math.min(WH-30,spawn.y+Math.sin(a)*r))}}

function survivorHit(t){if(!t)return;if(t.kind==='player'){hurtPlayer(25)}else{const b=t.ref;if(!survivorAlive(b))return;b.health=Math.max(0,b.health-25);if(b.health<=0){b.dead=true;b.respawn=3;banner(b.name+' was killed by THE RAKE')}}survivorHits++;if(survivorHits>=2){survivorLastTarget=t;survivorTarget=null;survivorHits=0}}

updateSurvivorCount();$('connection').textContent='AI Survivors';const oldSend=sendNetworkState;sendNetworkState=()=>{};

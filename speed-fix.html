<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>The Rake — Whispering Pines Bots</title></head><body><script>(async()=>{try{let r=await fetch('/index.html',{cache:'no-store'}),html=await r.text();html=html.replace(/navigateTo\(spawn,11,dt,true\)/g,'navigateTo(spawn,29,dt,true)').replace(/navigateTo\(player,19,dt,true\)/g,'navigateTo(player,34,dt,true)').replace(/followTrail\(dt,now,7\)/g,'followTrail(dt,now,29)').replace(/\$\('speed'\)\.textContent=rake\.mode==='stalking'\?'19':rake\.mode==='lunging'\?'25':rake\.mode==='retreating'\?'11':'7'/g,"$('speed').textContent=rake.mode==='stalking'?'34':rake.mode==='lunging'?'25':rake.mode==='retreating'?'29':'29'");const botScript=`(()=>{const botCount=4,bots=[];const botNames=['Survivor 1','Survivor 2','Survivor 3','Survivor 4'];const spawnBot=(i)=>{let a=i*Math.PI*2/botCount+Math.random()*.4,d=170+Math.random()*110;return{id:i+1,name:botNames[i],x:Math.max(60,Math.min(WW-60,spawn.x+Math.cos(a)*d)),y:Math.max(60,Math.min(WH-60,spawn.y+Math.sin(a)*d)),r:11,health:100,maxHealth:100,dead:false,respawn:0,target:null,path:[],pathIndex:0,pathGoal:null,pathTimer:0,wander:null,wanderTimer:0}};for(let i=0;i<botCount;i++)bots.push(spawnBot(i));window.rakeBots=bots;function alive(t){return t&&(!t.dead)&&t.health>0}function candidates(){const a=[];if(alive(player))a.push({kind:'player',ref:player,name:'You'});for(const b of bots)if(alive(b))a.push({kind:'bot',ref:b,name:b.name});return a}function nearestTarget(){return candidates().filter(t=>dist(rake,t.ref)<=100).sort((a,b)=>dist(rake,a.ref)-dist(rake,b.ref))[0]||null}let currentTarget=null,targetHits=0;function chooseTarget(){if(currentTarget&&alive(currentTarget.ref)&&dist(rake,currentTarget.ref)<=100&&targetHits<2)return currentTarget;const n=nearestTarget();currentTarget=n;targetHits=0;return n}function hitTarget(t){if(!t||!alive(t.ref))return;if(t.kind==='player'){hurtPlayer(25)}else{t.ref.health=Math.max(0,t.ref.health-25);if(t.ref.health<=0){t.ref.dead=true;t.ref.respawn=2.2;banner(t.ref.name+' was taken by THE RAKE')}}targetHits++;if(targetHits>=2||!alive(t.ref)){currentTarget=null;targetHits=0}}function startBotSlash(){if(rake.attackCooldown>0||!currentTarget)return;rake.attackFrame=Math.random()<.5?1:2;rake.attackTimer=0;rake.attackCooldown=2.4;rake.attackDamageCooldown=0;rake.animName='attack';rake.isMoving=false}window.startSlash=startBotSlash;function updateBotAttack(dt){rake.attackCooldown=Math.max(0,rake.attackCooldown-dt);if(rake.animName==='attack'){rake.attackTimer+=dt;if(rake.attackTimer>=.42){rake.animName='idle';rake.attackTimer=0}if(rake.attackDamageCooldown<=0&&currentTarget&&alive(currentTarget.ref)&&dist(rake,currentTarget.ref)<30){hitTarget(currentTarget);rake.attackDamageCooldown=3}}else rake.attackDamageCooldown=0}window.updateAttack=updateBotAttack;function botMove(b,t,s,dt){const dx=t.x-b.x,dy=t.y-b.y,d=Math.hypot(dx,dy)||1;b.x=Math.max(25,Math.min(WW-25,b.x+dx/d*s*dt));b.y=Math.max(25,Math.min(WH-25,b.y+dy/d*s*dt))}function updateBots(dt){for(let i=0;i<bots.length;i++){const b=bots[i];if(b.dead){b.respawn-=dt;if(b.respawn<=0){const fresh=spawnBot(i);b.x=fresh.x;b.y=fresh.y;b.health=100;b.dead=false;b.path=[];b.wander=null}continue}b.wanderTimer-=dt;if(!b.wander||b.wanderTimer<=0){b.wander={x:Math.max(50,Math.min(WW-50,rand(80,WW-80))),y:Math.max(50,Math.min(WH-50,rand(80,WH-80)))};b.wanderTimer=2.5+Math.random()*4}botMove(b,b.wander,8+Math.random()*3,dt)}}function botAI(dt,now){updateBots(dt);rake.isMoving=false;if(!night){currentTarget=null;targetHits=0;mode('retreating');rake.animName='walk';navigateTo(spawn,29,dt,true);return}const t=chooseTarget();if(t){const d=dist(rake,t.ref);$('distance').textContent=Math.round(d)+' studs';if(d<30){mode('attacking');rake.animName='attack';startBotSlash()}else{mode('stalking');rake.animName='walk';rake.path=[];navigateTo(t.ref,34,dt,true)}return}currentTarget=null;targetHits=0;if(rake.mode==='hiding'){rake.animName='idle';rake.path=[];rake.pathTimer=0;if(now>=rake.hideUntil){mode('searching');point()}return}mode('searching');rake.animName='walk';if(playerTrail.length)followTrail(dt,now,29);else{rake.searchPoint={x:player.x,y:player.y};navigateTo(player,29,dt,true)}}window.ai=botAI;window.updatePlayerCount=()=>{$('playerCount').textContent=String(botCount+1)};window.connectMultiplayer=()=>{$('connection').textContent='AI Bots';if(socket&&socket.readyState<=1)try{socket.close()}catch{};socket=null};if(socket&&socket.readyState<=1)try{socket.close()}catch{};socket=null;$('connection').textContent='AI Bots';$('playerCount').textContent=String(botCount+1);$('legend').textContent='Dark circles are bushes • 100 studs = active range • 4 AI survivors';function drawBots(){const scale=Math.min(W/1100,H/700),viewW=W/scale,viewH=H/scale,cameraX=Math.max(0,Math.min(WW-viewW,player.x-viewW/2)),cameraY=Math.max(0,Math.min(WH-viewH,player.y-viewH/2));x.save();x.scale(scale,scale);x.translate(-cameraX,-cameraY);for(const b of bots){if(b.dead)continue;x.fillStyle='#6e9fff';x.beginPath();x.arc(b.x,b.y,b.r,0,Math.PI*2);x.fill();x.fillStyle='#e7eefb';x.font='11px system-ui';x.textAlign='center';x.fillText(b.name,b.x,b.y-18);x.fillStyle='#1b2420';x.fillRect(b.x-16,b.y+15,32,4);x.fillStyle='#69cf7b';x.fillRect(b.x-16,b.y+15,32*(b.health/b.maxHealth),4)}x.restore()}let botLast=performance.now();function botFrame(t){const dt=Math.min(.05,(t-botLast)/1000);botLast=t;drawBots();requestAnimationFrame(botFrame)}requestAnimationFrame(botFrame);})();`;html=html.replace('</body>','<script>'+botScript.replace(/<\/script/gi,'<\\/script')+'</script></body>');document.open();document.write(html);document.close()}catch(e){document.body.textContent='Failed to load the game: '+e.message}})()</script></body></html>

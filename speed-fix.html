<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>The Rake — Whispering Pines AI Survivors</title></head><body><script>(async()=>{try{let r=await fetch('/index.html',{cache:'no-store'}),html=await r.text();html=html.replace('const survivors=Array.from({length:4},(_,i)=>new Survivor(i));','const survivors=Array.from({length:4},(_,i)=>new Survivor(i));survivors.forEach(s=>{s.scheduleTimer=8+Math.random()*18;s.leaveTimer=0});');html=html.replace("function chooseTarget(){const list=[];if(!player.dead)list.push(player);for(const s of survivors)if(!s.dead&&s.health>0)list.push(s);const nearby=list.filter(t=>dist(rake,t)<=100);if(aliveTarget(rakeTarget)&&dist(rake,rakeTarget)<=100&&rakeHits<2)return rakeTarget;let next=nearby.find(t=>t!==rakeLastTarget)||nearby[0]||null;if(next!==rakeTarget)rakeHits=0;rakeTarget=next;return next}","function chooseTarget(){const list=survivors.filter(s=>!s.dead&&s.health>0);const nearby=list.filter(t=>dist(rake,t)<=100);if(aliveTarget(rakeTarget)&&rakeTarget!==player&&dist(rake,rakeTarget)<=100&&rakeHits<2)return rakeTarget;let next=nearby.find(t=>t!==rakeLastTarget)||nearby[0]||null;if(next!==rakeTarget)rakeHits=0;rakeTarget=next;return next}");html=html.replace("function followTrail(dt,now){if(!playerTrail.length){navigate(rake,player,29,dt);return}const latest=playerTrail.length-1,targetIndex=Math.max(0,latest-2),target=playerTrail[targetIndex];trailCursor=targetIndex;navigate(rake,target,29,dt);if(dist(rake,target)<12&&latest>0)trailCursor=Math.max(0,targetIndex-1)}","function followTrail(dt,now){const available=survivors.filter(s=>!s.dead&&s.health>0);if(available.length){let target=available.reduce((a,b)=>dist(rake,a)<dist(rake,b)?a:b);navigate(rake,target,29,dt)}else{const target={x:spawn.x+Math.cos(now*.35)*180,y:spawn.y+Math.sin(now*.35)*180};navigate(rake,target,29,dt)}}");html=html.replace("for(const s of survivors)s.update(dt);","for(const s of survivors){if(!s.dead){s.scheduleTimer-=dt;if(s.scheduleTimer<=0){s.dead=true;s.health=100;s.respawnTimer=Infinity;s.leaveTimer=6+Math.random()*10;if(rakeTarget===s){rakeTarget=null;rakeHits=0}banner(s.name+' left the woods')}}else if(s.respawnTimer===Infinity){s.leaveTimer-=dt;if(s.leaveTimer<=0){s.respawn();s.scheduleTimer=10+Math.random()*22;banner(s.name+' rejoined the woods')}}s.update(dt)}");html=html.replace("$('distance').textContent=Math.round(dist(rake,player))+' studs';","$('distance').textContent=rakeTarget?Math.round(dist(rake,rakeTarget))+' studs':'—';");document.open();document.write(html);document.close()}catch(e){document.body.textContent='Failed to load the game: '+e.message}})()</script></body></html>

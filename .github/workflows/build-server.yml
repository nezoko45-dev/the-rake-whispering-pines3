name: Build The Rake Server EXE
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - server.js
      - package.json
      - index.html
      - game.js
      - styles.css
      - assets/rake/rake.glb
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npx pkg server.js --targets node20-win-x64 --output TheRakeServer.exe
      - uses: actions/upload-artifact@v4
        with:
          name: TheRakeServer-Windows
          path: TheRakeServer.exe

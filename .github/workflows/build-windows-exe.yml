name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    paths:
      - "desktop-server.js"
      - "package.json"
      - ".github/workflows/build-windows-exe.yml"

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npx --yes pkg desktop-server.js --targets node20-win-x64 --output server.exe
      - name: Verify executable
        shell: pwsh
        run: |
          if (!(Test-Path server.exe)) { throw "server.exe was not created" }
          Get-Item server.exe | Format-List Name,Length
      - name: Package game
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist/the-rake | Out-Null
          Copy-Item index.html dist/the-rake/index.html
          Copy-Item server.exe dist/the-rake/server.exe
          Copy-Item -Recurse assets dist/the-rake/assets
          Copy-Item README.md dist/the-rake/README.md
          Set-Content dist/the-rake/START_GAME.bat '@echo off
cd /d "%~dp0"
start "" "%~dp0server.exe"
'
      - uses: actions/upload-artifact@v4
        with:
          name: the-rake-windows
          path: dist/the-rake
